name: Collect DevEx Metrics

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      owner:
        description: "GitHub org or user to collect. Defaults to the DEVEX_OWNER variable."
        required: false
      owner_type:
        description: "org or user. Defaults to the DEVEX_OWNER_TYPE variable."
        required: false
        type: choice
        options: ["", "org", "user"]
        default: ""
      replay_snapshots:
        description: "Replay committed fixture snapshots into the history store before collecting"
        required: false
        default: false
        type: boolean
      backfill_pages:
        description: "Override the historical crawl budget for this run (pages). Blank uses the configured default."
        required: false

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      # actions/checkout requires read access to the repository.
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The backfill replays the full commit history of the fixture file.
          fetch-depth: ${{ inputs.replay_snapshots && 0 || 1 }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Get today's date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Per-repo Copilot agent data is expensive to re-fetch and terminal tasks
      # never change, so it stays in the Actions cache. The durable record lives
      # on the metrics-data branch instead — the cache is only a speed-up.
      - name: Restore agent data cache
        uses: actions/cache@v6
        with:
          path: data/agents-*.json
          key: agent-data-${{ github.repository_owner }}-${{ steps.date.outputs.date }}
          restore-keys: |
            agent-data-${{ github.repository_owner }}-

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Append-only data store on an orphan branch. Nothing is ever committed
      # to the default branch.
      - name: Check out history store
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: scripts/metrics-data.sh checkout .metrics-data

      - name: Replay committed snapshots into the history store
        if: inputs.replay_snapshots
        run: |
          FIXTURE="data/${{ inputs.owner || vars.DEVEX_OWNER }}.fixture.json"
          if [ -f "$FIXTURE" ]; then
            node scripts/backfill-history.mjs "$FIXTURE" .metrics-data/data
          else
            echo "No fixture at $FIXTURE — nothing to backfill."
          fi

      - name: Collect metrics
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          # Fine-grained PAT with "Agent tasks" repo permission.
          # GitHub App installation tokens are not supported for this API.
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          DEVEX_OWNER: ${{ inputs.owner || vars.DEVEX_OWNER }}
          DEVEX_OWNER_TYPE: ${{ inputs.owner_type || vars.DEVEX_OWNER_TYPE }}
          DEVEX_CONFIG: ${{ vars.DEVEX_CONFIG }}
          DEVEX_REPOS_INCLUDE: ${{ vars.DEVEX_REPOS_INCLUDE }}
          DEVEX_REPOS_EXCLUDE: ${{ vars.DEVEX_REPOS_EXCLUDE }}
          DEVEX_EXCLUDE_ARCHIVED: ${{ vars.DEVEX_EXCLUDE_ARCHIVED }}
          DEVEX_EXCLUDE_FORKS: ${{ vars.DEVEX_EXCLUDE_FORKS }}
          DEVEX_MAX_IDLE_DAYS: ${{ vars.DEVEX_MAX_IDLE_DAYS }}
          DEVEX_TEAM_REPOS: ${{ vars.DEVEX_TEAM_REPOS }}
          DEVEX_TEAM_NAME: ${{ vars.DEVEX_TEAM_NAME }}
          DEVEX_TEAM_ID: ${{ vars.DEVEX_TEAM_ID }}
          DEVEX_DISCOVER_ALL: ${{ vars.DEVEX_DISCOVER_ALL }}
          DEVEX_TRIAL_TITLE: ${{ vars.DEVEX_TRIAL_TITLE }}
          DEVEX_TRIAL_HYPOTHESIS: ${{ vars.DEVEX_TRIAL_HYPOTHESIS }}
          DEVEX_TRIAL_START: ${{ vars.DEVEX_TRIAL_START }}
          DEVEX_BASELINE_FROM: ${{ vars.DEVEX_BASELINE_FROM }}
          DEVEX_BASELINE_TO: ${{ vars.DEVEX_BASELINE_TO }}
          DEVEX_TRIAL_MILESTONES: ${{ vars.DEVEX_TRIAL_MILESTONES }}
          DEVEX_HISTORY_WEEKS: ${{ vars.DEVEX_HISTORY_WEEKS }}
          DEVEX_MAX_PR_PAGES: ${{ vars.DEVEX_MAX_PR_PAGES }}
          DEVEX_MAX_REPO_AGE_HOURS: ${{ vars.DEVEX_MAX_REPO_AGE_HOURS }}
          DEVEX_FEATURE_DEPENDENTS: ${{ vars.DEVEX_FEATURE_DEPENDENTS }}
          DEVEX_FEATURE_COPILOT_AGENT: ${{ vars.DEVEX_FEATURE_COPILOT_AGENT }}
          DEVEX_FEATURE_CI_HEALTH: ${{ vars.DEVEX_FEATURE_CI_HEALTH }}
          DEVEX_CI_PAGES_PER_RUN: ${{ vars.DEVEX_CI_PAGES_PER_RUN }}
          DEVEX_CI_MAX_PAGES_PER_REPO: ${{ vars.DEVEX_CI_MAX_PAGES_PER_REPO }}
          DEVEX_CI_WINDOW_DAYS: ${{ vars.DEVEX_CI_WINDOW_DAYS }}
          DEVEX_BACKFILL_ENABLED: ${{ vars.DEVEX_BACKFILL_ENABLED }}
          DEVEX_BACKFILL_PAGES_PER_RUN: ${{ inputs.backfill_pages || vars.DEVEX_BACKFILL_PAGES_PER_RUN }}
          DEVEX_BACKFILL_MAX_PAGES_PER_REPO: ${{ vars.DEVEX_BACKFILL_MAX_PAGES_PER_REPO }}
          DEVEX_BACKFILL_RECOMPUTE: ${{ vars.DEVEX_BACKFILL_RECOMPUTE }}
          DEVEX_HISTORY_DIR: .metrics-data/data
        run: node dist/index.js

      - name: Publish history store
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          scripts/metrics-data.sh publish .metrics-data \
            "data: ${{ inputs.owner || vars.DEVEX_OWNER }} ${{ steps.date.outputs.date }}"

  pages:
    needs: collect
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    with:
      owner: ${{ inputs.owner }}
