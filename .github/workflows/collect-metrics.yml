name: Collect DevEx Metrics

on:
  schedule:
    # Run daily at 06:00 UTC. The scheduled run is always a full collection
    # and seeds the day's snapshot cache that manual runs build on.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Ignore today's cached snapshot and re-collect every repository"
        required: false
        default: false
        type: boolean
      owner:
        description: "GitHub org or user to collect. Defaults to the DEVEX_OWNER variable."
        required: false
      owner_type:
        description: "org or user. Defaults to the DEVEX_OWNER_TYPE variable."
        required: false
        type: choice
        options: ["", "org", "user"]
        default: ""
      replay_snapshots:
        description: "Replay committed fixture snapshots into the history store before collecting"
        required: false
        default: false
        type: boolean
      backfill_pages:
        description: "Override the historical crawl budget for this run (pages). Blank uses the configured default."
        required: false

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      landscape-publish: ${{ steps.landscape-failed.outputs.landscape-publish }}
      discovery-publish: ${{ steps.discovery-failed.outputs.discovery-publish }}
      history-published: ${{ steps.publish-history.outcome }}
    permissions:
      # The job also publishes the append-only metrics-data branch.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The backfill replays the full commit history of the fixture file.
          fetch-depth: ${{ inputs.replay_snapshots && 0 || 1 }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Get today's date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # Scheduled runs (and manual runs asking for it) collect everything.
      # Other manual runs only re-collect repositories that changed since
      # today's snapshot.
      - name: Choose collection mode
        id: mode
        env:
          FULL: ${{ github.event_name != 'workflow_dispatch' || inputs.full_refresh }}
        run: |
          if [ "$FULL" = "true" ]; then
            echo "incremental=false" >> "$GITHUB_OUTPUT"
            echo "Full collection" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "incremental=true" >> "$GITHUB_OUTPUT"
            echo "Incremental collection (delta since today's snapshot)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The collected snapshot is keyed by UTC date, so a new day never builds
      # on yesterday's data. Every successful run saves a new entry (cache keys
      # are immutable) and a manual run restores the newest one from today.
      - name: Restore today's metrics snapshot
        if: steps.mode.outputs.incremental == 'true'
        uses: actions/cache/restore@v6
        with:
          # The owner may only be set inside DEVEX_CONFIG, so match the
          # snapshot by pattern rather than by name.
          path: |
            data/*.json
            !data/*.fixture.json
            !data/agents-*.json
          key: metrics-snapshot-${{ inputs.owner || vars.DEVEX_OWNER || github.repository_owner }}-${{ steps.date.outputs.date }}
          restore-keys: |
            metrics-snapshot-${{ inputs.owner || vars.DEVEX_OWNER || github.repository_owner }}-${{ steps.date.outputs.date }}-

      # Per-repo Copilot agent data is expensive to re-fetch and terminal tasks
      # never change, so it stays in the Actions cache. The durable record lives
      # on the metrics-data branch instead — the cache is only a speed-up.
      - name: Restore agent data cache
        uses: actions/cache@v6
        with:
          path: data/agents-*.json
          key: agent-data-${{ github.repository_owner }}-${{ steps.date.outputs.date }}
          restore-keys: |
            agent-data-${{ github.repository_owner }}-

      # Append-only data store on an orphan branch. Nothing is ever committed
      # to the default branch.
      - name: Check out history store
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/metrics-data.sh checkout .metrics-data

      - name: Replay committed snapshots into the history store
        if: inputs.replay_snapshots
        run: |
          FIXTURE="data/${{ inputs.owner || vars.DEVEX_OWNER }}.fixture.json"
          if [ -f "$FIXTURE" ]; then
            node scripts/backfill-history.mjs "$FIXTURE" .metrics-data/data
          else
            echo "No fixture at $FIXTURE — nothing to backfill."
          fi

      - name: Collect metrics
        id: collect
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          # Fine-grained PAT with "Agent tasks" repo permission.
          # GitHub App installation tokens are not supported for this API.
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          DEVEX_OWNER: ${{ inputs.owner || vars.DEVEX_OWNER }}
          DEVEX_OWNER_TYPE: ${{ inputs.owner_type || vars.DEVEX_OWNER_TYPE }}
          DEVEX_CONFIG: ${{ vars.DEVEX_CONFIG }}
          DEVEX_REPOS_INCLUDE: ${{ vars.DEVEX_REPOS_INCLUDE }}
          DEVEX_REPOS_EXCLUDE: ${{ vars.DEVEX_REPOS_EXCLUDE }}
          DEVEX_EXCLUDE_ARCHIVED: ${{ vars.DEVEX_EXCLUDE_ARCHIVED }}
          DEVEX_EXCLUDE_FORKS: ${{ vars.DEVEX_EXCLUDE_FORKS }}
          DEVEX_MAX_IDLE_DAYS: ${{ vars.DEVEX_MAX_IDLE_DAYS }}
          DEVEX_TEAM_REPOS: ${{ vars.DEVEX_TEAM_REPOS }}
          DEVEX_TEAM_HANDLES: ${{ vars.DEVEX_TEAM_HANDLES }}
          DEVEX_TEAM_NAME: ${{ vars.DEVEX_TEAM_NAME }}
          DEVEX_TEAM_ID: ${{ vars.DEVEX_TEAM_ID }}
          DEVEX_DISCOVER_ALL: ${{ vars.DEVEX_DISCOVER_ALL }}
          DEVEX_TRIAL_TITLE: ${{ vars.DEVEX_TRIAL_TITLE }}
          DEVEX_TRIAL_HYPOTHESIS: ${{ vars.DEVEX_TRIAL_HYPOTHESIS }}
          DEVEX_TRIAL_START: ${{ vars.DEVEX_TRIAL_START }}
          DEVEX_BASELINE_FROM: ${{ vars.DEVEX_BASELINE_FROM }}
          DEVEX_BASELINE_TO: ${{ vars.DEVEX_BASELINE_TO }}
          DEVEX_TRIAL_MILESTONES: ${{ vars.DEVEX_TRIAL_MILESTONES }}
          DEVEX_HISTORY_WEEKS: ${{ vars.DEVEX_HISTORY_WEEKS }}
          DEVEX_MAX_PR_PAGES: ${{ vars.DEVEX_MAX_PR_PAGES }}
          DEVEX_MAX_REPO_AGE_HOURS: ${{ vars.DEVEX_MAX_REPO_AGE_HOURS }}
          DEVEX_INCREMENTAL: ${{ steps.mode.outputs.incremental }}
          DEVEX_FEATURE_DEPENDENTS: ${{ vars.DEVEX_FEATURE_DEPENDENTS }}
          DEVEX_FEATURE_COPILOT_AGENT: ${{ vars.DEVEX_FEATURE_COPILOT_AGENT }}
          DEVEX_FEATURE_CI_HEALTH: ${{ vars.DEVEX_FEATURE_CI_HEALTH }}
          DEVEX_FEATURE_LANDSCAPE: ${{ vars.DEVEX_FEATURE_LANDSCAPE }}
          DEVEX_FEATURE_PUBLIC_DISCOVERY: ${{ vars.DEVEX_FEATURE_PUBLIC_DISCOVERY }}
          DEVEX_PUBLIC_DISCOVERY_MAX_REPOS: ${{ vars.DEVEX_PUBLIC_DISCOVERY_MAX_REPOS }}
          DEVEX_PUBLIC_DISCOVERY_MAX_SIZE_KB: ${{ vars.DEVEX_PUBLIC_DISCOVERY_MAX_SIZE_KB }}
          DEVEX_PUBLIC_DISCOVERY_MAX_CLONE_SIZE_KB: ${{ vars.DEVEX_PUBLIC_DISCOVERY_MAX_CLONE_SIZE_KB }}
          DEVEX_PUBLIC_DISCOVERY_CLONE_MINUTES: ${{ vars.DEVEX_PUBLIC_DISCOVERY_CLONE_MINUTES }}
          DEVEX_CI_PAGES_PER_RUN: ${{ vars.DEVEX_CI_PAGES_PER_RUN }}
          DEVEX_CI_MAX_PAGES_PER_REPO: ${{ vars.DEVEX_CI_MAX_PAGES_PER_REPO }}
          DEVEX_CI_WINDOW_DAYS: ${{ vars.DEVEX_CI_WINDOW_DAYS }}
          # The historical crawl is left to the nightly run so a manual refresh
          # stays quick, unless the run explicitly asks for a crawl budget.
          DEVEX_BACKFILL_ENABLED: ${{ (steps.mode.outputs.incremental == 'true' && !inputs.backfill_pages) && 'false' || vars.DEVEX_BACKFILL_ENABLED }}
          DEVEX_BACKFILL_PAGES_PER_RUN: ${{ inputs.backfill_pages || vars.DEVEX_BACKFILL_PAGES_PER_RUN }}
          DEVEX_BACKFILL_MAX_PAGES_PER_REPO: ${{ vars.DEVEX_BACKFILL_MAX_PAGES_PER_REPO }}
          DEVEX_BACKFILL_RECOMPUTE: ${{ vars.DEVEX_BACKFILL_RECOMPUTE }}
          DEVEX_BACKFILL_PAGE_SIZE: ${{ vars.DEVEX_BACKFILL_PAGE_SIZE }}
          DEVEX_BACKFILL_MIN_PAGE_SIZE: ${{ vars.DEVEX_BACKFILL_MIN_PAGE_SIZE }}
          DEVEX_BACKFILL_ADAPTIVE_PAGE_SIZE: ${{ vars.DEVEX_BACKFILL_ADAPTIVE_PAGE_SIZE }}
          DEVEX_HISTORY_DIR: .metrics-data/data
        run: node dist/index.js

      - name: Save metrics snapshot
        if: always() && steps.collect.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          # The owner may only be set inside DEVEX_CONFIG, so match the
          # snapshot by pattern rather than by name.
          path: |
            data/*.json
            !data/*.fixture.json
            !data/agents-*.json
          key: metrics-snapshot-${{ inputs.owner || vars.DEVEX_OWNER || github.repository_owner }}-${{ steps.date.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Prepare resolves DEVEX_CONFIG and the discrete variables; it returns
      # without scanning when landscape is disabled.
      - name: Prepare public landscape scan
        id: landscape
        env:
          DEVEX_OWNER: ${{ inputs.owner || vars.DEVEX_OWNER }}
          DEVEX_HISTORY_DIR: .metrics-data/data
          DEVEX_CONFIG: ${{ vars.DEVEX_CONFIG }}
          DEVEX_FEATURE_LANDSCAPE: ${{ vars.DEVEX_FEATURE_LANDSCAPE }}
          DEVEX_LANDSCAPE_STALE_AFTER_DAYS: ${{ vars.DEVEX_LANDSCAPE_STALE_AFTER_DAYS }}
          DEVEX_TEAM_HANDLES: ${{ vars.DEVEX_TEAM_HANDLES }}
        run: node dist/landscape-cli.js prepare

      # An empty repositories input with owner would grant every installed repo.
      - name: Check landscape token scope
        if: steps.landscape.outputs.landscape-enabled == 'true' && steps.landscape.outputs.landscape-scan-needed == 'true'
        env:
          LANDSCAPE_REPOSITORIES: ${{ steps.landscape.outputs.landscape-repositories }}
        run: |
          if [[ ! "$LANDSCAPE_REPOSITORIES" =~ ^[A-Za-z0-9._-]+(,[A-Za-z0-9._-]+)*$ ]]; then
            echo "Landscape prepare did not return a valid non-empty list of repository names; refusing an owner-wide token" >&2
            exit 1
          fi

      # Missing App access (e.g. the App is not installed on the landscape
      # owner) should not fail the whole collection: the next step turns it
      # into a warning and the landscape is recorded as a failed, stale run.
      - name: Create landscape scan token
        id: landscape-token
        if: steps.landscape.outputs.landscape-enabled == 'true' && steps.landscape.outputs.landscape-scan-needed == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # GitHub accepts the App ID as the JWT issuer too, so the existing
          # APP_ID variable works here without deployments adding a client ID.
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.landscape.outputs.landscape-owner }}
          repositories: ${{ steps.landscape.outputs.landscape-repositories }}
          permission-contents: read

      - name: Warn about missing landscape token
        if: steps.landscape-token.outcome == 'failure'
        env:
          APP_ID: ${{ vars.APP_ID }}
          LANDSCAPE_OWNER: ${{ steps.landscape.outputs.landscape-owner }}
          LANDSCAPE_REPOSITORIES: ${{ steps.landscape.outputs.landscape-repositories }}
        run: |
          first_repo="${LANDSCAPE_REPOSITORIES%%,*}"
          echo "::warning title=Landscape scan skipped::Could not create a GitHub App token for the landscape repositories of '${LANDSCAPE_OWNER}'. Install the App (APP_ID ${APP_ID}) on '${LANDSCAPE_OWNER}' with access to every selected repository and Contents: read. See the step summary for details."
          {
            echo "## :warning: Landscape scan skipped"
            echo
            echo "The GitHub App token for the landscape scan could not be created, so no repositories were scanned."
            echo "The last good landscape data is kept and the dashboard marks it as stale. The rest of the collection ran normally."
            echo
            echo "A \`404\` on \`GET /repos/${LANDSCAPE_OWNER}/${first_repo}/installation\` means the App has no installation covering that repository."
            echo
            echo "### How to fix"
            echo
            echo "1. Install the GitHub App identified by \`APP_ID\` (\`${APP_ID}\`) on the **${LANDSCAPE_OWNER}** account."
            echo "2. Give the installation access to **every** selected landscape repository (or choose *All repositories*), starting with \`${LANDSCAPE_OWNER}/${first_repo}\`."
            echo "3. Make sure the App has the \`Contents: read\` permission."
            echo "4. Alternatively, narrow the landscape repository selection to repositories the installation already covers."
            echo "5. Re-run **Collect DevEx Metrics** to confirm."
            echo
            echo "See the *Public landscape* section of \`docs/CONFIGURATION.md\` for details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan selected public repositories
        id: landscape-scan
        if: steps.landscape-token.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ steps.landscape-token.outputs.token }}
        run: npx --no-install repo-landscape scan --config data/landscape.config.json --output data/landscape-raw.json

      # Any failure after the scan token exists (including a scanner 403/404
      # on a repo that just went private) skips ingestion; re-check visibility
      # so repos no longer public are scrubbed before recording the failure.
      - name: Re-check landscape visibility after a failure
        id: landscape-recheck
        if: failure() && steps.landscape-token.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ steps.landscape-token.outputs.token }}
          DEVEX_OWNER: ${{ inputs.owner || vars.DEVEX_OWNER }}
          DEVEX_HISTORY_DIR: .metrics-data/data
          DEVEX_CONFIG: ${{ vars.DEVEX_CONFIG }}
          DEVEX_FEATURE_LANDSCAPE: ${{ vars.DEVEX_FEATURE_LANDSCAPE }}
          DEVEX_LANDSCAPE_STALE_AFTER_DAYS: ${{ vars.DEVEX_LANDSCAPE_STALE_AFTER_DAYS }}
        run: node dist/landscape-cli.js recheck

      - name: Ingest sanitized landscape snapshots
        id: landscape-ingest
        if: steps.landscape-token.outcome == 'success'
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ steps.landscape-token.outputs.token }}
          DEVEX_OWNER: ${{ inputs.owner || vars.DEVEX_OWNER }}
          DEVEX_HISTORY_DIR: .metrics-data/data
          DEVEX_CONFIG: ${{ vars.DEVEX_CONFIG }}
          DEVEX_FEATURE_LANDSCAPE: ${{ vars.DEVEX_FEATURE_LANDSCAPE }}
          DEVEX_LANDSCAPE_STALE_AFTER_DAYS: ${{ vars.DEVEX_LANDSCAPE_STALE_AFTER_DAYS }}
          DEVEX_TEAM_HANDLES: ${{ vars.DEVEX_TEAM_HANDLES }}
        run: node dist/landscape-cli.js ingest data/landscape-raw.json

      # On any failure with landscape enabled, keep the last good landscape
      # data, scrub repos outside the current public selection, and record the
      # failure so the dashboard marks the data as stale. The store is then
      # published and Pages rebuilt, and the run still reports its failure
      # (except for a missing scan token, which is only a warning).
      - name: Record failed landscape run
        id: landscape-failed
        if: failure() || steps.landscape-token.outcome == 'failure'
        env:
          DEVEX_OWNER: ${{ inputs.owner || vars.DEVEX_OWNER }}
          DEVEX_HISTORY_DIR: .metrics-data/data
          DEVEX_CONFIG: ${{ vars.DEVEX_CONFIG }}
          DEVEX_FEATURE_LANDSCAPE: ${{ vars.DEVEX_FEATURE_LANDSCAPE }}
        run: node dist/landscape-cli.js mark-failed

      # Independent of the existing AI-only GitHub API landscape scan. No extra
      # token or clone is requested while public discovery is disabled.
      - name: Prepare full-history public discovery
        id: discovery-prepare
        if: always() && steps.collect.outcome == 'success'
        continue-on-error: true
        env:
          DEVEX_OWNER: ${{ inputs.owner || vars.DEVEX_OWNER }}
          DEVEX_HISTORY_DIR: .metrics-data/data
          DEVEX_CONFIG: ${{ vars.DEVEX_CONFIG }}
          DEVEX_FEATURE_PUBLIC_DISCOVERY: ${{ vars.DEVEX_FEATURE_PUBLIC_DISCOVERY }}
          DEVEX_PUBLIC_DISCOVERY_MAX_REPOS: ${{ vars.DEVEX_PUBLIC_DISCOVERY_MAX_REPOS }}
          DEVEX_PUBLIC_DISCOVERY_MAX_SIZE_KB: ${{ vars.DEVEX_PUBLIC_DISCOVERY_MAX_SIZE_KB }}
          DEVEX_PUBLIC_DISCOVERY_MAX_CLONE_SIZE_KB: ${{ vars.DEVEX_PUBLIC_DISCOVERY_MAX_CLONE_SIZE_KB }}
          DEVEX_PUBLIC_DISCOVERY_CLONE_MINUTES: ${{ vars.DEVEX_PUBLIC_DISCOVERY_CLONE_MINUTES }}
          DEVEX_LANDSCAPE_STALE_AFTER_DAYS: ${{ vars.DEVEX_LANDSCAPE_STALE_AFTER_DAYS }}
        run: node dist/public-discovery-cli.js prepare

      - name: Check public discovery token scope
        id: discovery-scope
        if: always() && steps.discovery-prepare.outcome == 'success' && steps.discovery-prepare.outputs.discovery-scan-needed == 'true'
        continue-on-error: true
        env:
          DISCOVERY_REPOSITORIES: ${{ steps.discovery-prepare.outputs.discovery-repositories }}
        run: |
          if [[ ! "$DISCOVERY_REPOSITORIES" =~ ^[A-Za-z0-9._-]+(,[A-Za-z0-9._-]+)*$ ]]; then
            echo "Public discovery cannot request an empty or invalid owner-wide token" >&2
            exit 1
          fi

      - name: Create public discovery token
        id: discovery-token
        if: always() && steps.discovery-scope.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.discovery-prepare.outputs.discovery-owner }}
          repositories: ${{ steps.discovery-prepare.outputs.discovery-repositories }}
          permission-contents: read

      - name: Verify public visibility and pin selected heads
        id: discovery-pin
        if: always() && steps.discovery-token.outcome == 'success'
        continue-on-error: true
        env:
          DEVEX_OWNER: ${{ inputs.owner || vars.DEVEX_OWNER }}
          DEVEX_HISTORY_DIR: .metrics-data/data
          DEVEX_CONFIG: ${{ vars.DEVEX_CONFIG }}
          DEVEX_FEATURE_PUBLIC_DISCOVERY: ${{ vars.DEVEX_FEATURE_PUBLIC_DISCOVERY }}
          DEVEX_PUBLIC_DISCOVERY_MAX_REPOS: ${{ vars.DEVEX_PUBLIC_DISCOVERY_MAX_REPOS }}
          DEVEX_PUBLIC_DISCOVERY_MAX_SIZE_KB: ${{ vars.DEVEX_PUBLIC_DISCOVERY_MAX_SIZE_KB }}
          DEVEX_PUBLIC_DISCOVERY_MAX_CLONE_SIZE_KB: ${{ vars.DEVEX_PUBLIC_DISCOVERY_MAX_CLONE_SIZE_KB }}
          DEVEX_PUBLIC_DISCOVERY_CLONE_MINUTES: ${{ vars.DEVEX_PUBLIC_DISCOVERY_CLONE_MINUTES }}
          DEVEX_LANDSCAPE_STALE_AFTER_DAYS: ${{ vars.DEVEX_LANDSCAPE_STALE_AFTER_DAYS }}
          GITHUB_TOKEN: ${{ steps.discovery-token.outputs.token }}
        run: node dist/public-discovery-cli.js pin

      - name: Clone pinned public histories
        id: discovery-clone
        if: always() && steps.discovery-pin.outcome == 'success'
        continue-on-error: true
        env:
          DEVEX_PUBLIC_DISCOVERY_MAX_SIZE_KB: ${{ steps.discovery-prepare.outputs.discovery-max-size-kb }}
          DEVEX_PUBLIC_DISCOVERY_MAX_CLONE_SIZE_KB: ${{ steps.discovery-prepare.outputs.discovery-max-clone-size-kb }}
          DEVEX_PUBLIC_DISCOVERY_CLONE_MINUTES: ${{ steps.discovery-prepare.outputs.discovery-clone-minutes }}
        run: node scripts/public-discovery-clone.mjs

      - name: Scan full-history public repositories
        id: discovery-scan
        if: always() && steps.discovery-clone.outcome == 'success'
        continue-on-error: true
        run: npx --no-install repo-landscape scan --repos-dir data/public-discovery-clones --expected-heads data/public-discovery.heads.json --config data/public-discovery.config.json --output data/public-discovery-raw.json

      - name: Refresh public discovery ingestion token
        id: discovery-ingest-token
        if: always() && steps.discovery-scan.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.discovery-prepare.outputs.discovery-owner }}
          repositories: ${{ steps.discovery-prepare.outputs.discovery-repositories }}
          permission-contents: read

      - name: Ingest sanitized public discovery
        id: discovery-ingest
        if: always() && steps.discovery-ingest-token.outcome == 'success'
        continue-on-error: true
        env:
          DEVEX_OWNER: ${{ inputs.owner || vars.DEVEX_OWNER }}
          DEVEX_HISTORY_DIR: .metrics-data/data
          DEVEX_CONFIG: ${{ vars.DEVEX_CONFIG }}
          DEVEX_FEATURE_PUBLIC_DISCOVERY: ${{ vars.DEVEX_FEATURE_PUBLIC_DISCOVERY }}
          DEVEX_PUBLIC_DISCOVERY_MAX_REPOS: ${{ vars.DEVEX_PUBLIC_DISCOVERY_MAX_REPOS }}
          DEVEX_PUBLIC_DISCOVERY_MAX_SIZE_KB: ${{ vars.DEVEX_PUBLIC_DISCOVERY_MAX_SIZE_KB }}
          DEVEX_PUBLIC_DISCOVERY_MAX_CLONE_SIZE_KB: ${{ vars.DEVEX_PUBLIC_DISCOVERY_MAX_CLONE_SIZE_KB }}
          DEVEX_PUBLIC_DISCOVERY_CLONE_MINUTES: ${{ vars.DEVEX_PUBLIC_DISCOVERY_CLONE_MINUTES }}
          DEVEX_LANDSCAPE_STALE_AFTER_DAYS: ${{ vars.DEVEX_LANDSCAPE_STALE_AFTER_DAYS }}
          GITHUB_TOKEN: ${{ steps.discovery-ingest-token.outputs.token }}
        run: node dist/public-discovery-cli.js ingest data/public-discovery-raw.json

      - name: Record failed public discovery
        id: discovery-failed
        if: always() && (steps.collect.outcome == 'failure' || steps.discovery-prepare.outcome == 'failure' || steps.discovery-scope.outcome == 'failure' || steps.discovery-token.outcome == 'failure' || steps.discovery-pin.outcome == 'failure' || steps.discovery-clone.outcome == 'failure' || steps.discovery-scan.outcome == 'failure' || steps.discovery-ingest-token.outcome == 'failure' || steps.discovery-ingest.outcome == 'failure')
        env:
          DEVEX_OWNER: ${{ inputs.owner || vars.DEVEX_OWNER }}
          DEVEX_HISTORY_DIR: .metrics-data/data
          DEVEX_CONFIG: ${{ vars.DEVEX_CONFIG }}
          DEVEX_FEATURE_PUBLIC_DISCOVERY: ${{ vars.DEVEX_FEATURE_PUBLIC_DISCOVERY }}
          DEVEX_PUBLIC_DISCOVERY_MAX_REPOS: ${{ vars.DEVEX_PUBLIC_DISCOVERY_MAX_REPOS }}
          DEVEX_PUBLIC_DISCOVERY_MAX_SIZE_KB: ${{ vars.DEVEX_PUBLIC_DISCOVERY_MAX_SIZE_KB }}
          DEVEX_PUBLIC_DISCOVERY_MAX_CLONE_SIZE_KB: ${{ vars.DEVEX_PUBLIC_DISCOVERY_MAX_CLONE_SIZE_KB }}
          DEVEX_PUBLIC_DISCOVERY_CLONE_MINUTES: ${{ vars.DEVEX_PUBLIC_DISCOVERY_CLONE_MINUTES }}
          DEVEX_LANDSCAPE_STALE_AFTER_DAYS: ${{ vars.DEVEX_LANDSCAPE_STALE_AFTER_DAYS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node dist/public-discovery-cli.js mark-failed

      - name: Publish history store
        id: publish-history
        if: success() || (failure() && (steps.landscape-failed.outputs.landscape-publish == 'true' || steps.discovery-failed.outputs.discovery-publish == 'true'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/metrics-data.sh publish .metrics-data \
            "data: ${{ inputs.owner || vars.DEVEX_OWNER }} ${{ steps.date.outputs.date }}"

      - name: Report failed public discovery
        if: always() && steps.discovery-failed.outputs.discovery-publish == 'true'
        run: |
          echo "::error title=Public discovery failed::The last safe observation was retained and marked stale."
          exit 1

  pages:
    needs: collect
    if: needs.collect.outputs.history-published == 'success' && (success() || (failure() && (needs.collect.outputs.landscape-publish == 'true' || needs.collect.outputs.discovery-publish == 'true')))
    # A called workflow can never hold more than its caller grants, and this
    # workflow denies everything by default — so the permissions pages.yml needs
    # must be granted here or the run fails before any job starts.
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    with:
      owner: ${{ github.event.inputs.owner || '' }}
