name: Deploy Pages

# Rebuilds and redeploys the dashboard without re-collecting: the site code
# changed, or a trial/branding variable was edited. Data is read from the
# metrics-data branch as it stands.
on:
  push:
    branches: [main]
    paths:
      - "src/build-pages.ts"
      - "src/report.ts"
      - "src/types.ts"
      - "src/config.ts"
      - "src/history.ts"
      - "src/stats.ts"
      - "src/pages/**"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      owner:
        description: "Owner to build the site for. Defaults to the DEVEX_OWNER variable."
        required: false

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    # A called workflow can never hold more than its caller grants, and this
    # workflow denies everything by default — so the permissions pages.yml needs
    # must be granted here or the run fails before any job starts.
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    with:
      # `inputs` is only populated for workflow_dispatch; on a push it resolves
      # to an empty string and pages.yml falls back to the DEVEX_OWNER variable.
      owner: ${{ github.event.inputs.owner || '' }}
